# All poses are the GRIPPER FRAME origin in the world frame (mm, orientation vector,
# theta in degrees), exactly as sent to motion.move - not fingertip positions.

# Fixed poses for the blind static pick/place cycle (no camera). From move_arm.py.
static:
  pick: {x: 300, y: -150, frame_z: 75, theta: 0}
  place: {x: 300, y: 150, frame_z: 75, theta: 0}

# Named poses the arm is sent to through the motion planner (never raw joint moves, so
# the workcell obstacles are always respected). `survey` is move_arm.py's WATCH_POSE,
# proven on the arm: the wrist camera sees the workspace from here. It is tilted about
# 22 degrees off vertical, which perception handles because it works in world coordinates.
# Re-teach any of them with: python scripts/01_teach_pose.py survey
# `home` falls back to `survey` until it is taught.
named:
  # Where every POSITION (and so every grasp) comes from. Xiang's `cans_view` (config/joint_positions.json),
  # read back as a gripper pose on 2026-09-18: all 11 cans in view, upright in the picture, YOLO 11/11. From
  # WATCH_POSE the cans sit sideways at the picture's left edge behind the arm's cable and YOLO found 2.
  # depth_scale and gripper.xy_offset were measured from this pose: grasps planned from another pose miss.
  # Since 2026-09-19 13:05: a higher, flatter view, COMPUTED from the arm's kinematics and then stood at - the arm
  # landed on it exactly (camera at (326, -355, 713), joints [-46.3, 7.7, -135.2, 7.6, 119.9, 47.6], joint 1 a whole
  # turn round). It looks 10 deg off straight down over the middle of the can area: cans are seen 10 deg (middle)
  # to 29 deg (corners) off vertical, against 35 to 49 deg from the old tilted view, so a height error moves a
  # position half as far and every lid is seen whole. Straight down cannot see the whole can area from any
  # height the arm reaches. From here YOLO needs the "round metal object" prompt (machine.yaml).
  # gripper.xy_offset was measured from the OLD view: re-measure it (scripts/02_hover_test.py).
  survey: {x: 308.2, y: -282.2, z: 623.0, o_x: 0.171, o_y: -0.014, o_z: -0.985, theta: -94.9}
  # The old survey (Xiang's `cans_view` joints), kept to go back to: copy it over `survey`.
  survey_tilted: {x: 92.2, y: -164.8, z: 571.6, o_x: 0.490, o_y: -0.333, o_z: -0.806, theta: 156.9}
  # Where LABELS are read from in `--mode label` (sort.yaml view: scan): Xiang's `cam_lower_pos`
  # (config/joint_positions.json), re-taught by hand on 2026-09-19 (fourth time) and read back from the arm as a gripper
  # pose in arm_origin. Lower and closer, so each can covers more pixels. Only its picture is used - for
  # what the cans ARE; where they are still comes from `survey`.
  scan: {x: 147.4568, y: -307.8784, z: 260.2248, o_x: 0.6131, o_y: 0.0633, o_z: -0.7875, theta: -179.059}
  watch: {x: 197.46, y: 0.14, z: 616.44, o_x: 0.3746, o_y: 0.0008, o_z: -0.9272, theta: -4.12}   # move_arm.py's WATCH_POSE

# survey <-> scan by FIXED JOINT ANGLES (config/joint_positions.json) instead of the planner, so the arm
# takes the same path down to the eye-level view and back every time. A raw joint move skips the
# planner's obstacle check, so it is used ONLY between these taught poses (both high above the table)
# and only when the arm is already at one of them, within tolerance_deg on every joint. Anywhere else
# (e.g. the first look of a run, or after a pick) the planner is used, as for every other move.
# Exact numbers: an arm a whole turn off on joint 1, 4 or 6 is in the same pose but has the camera cable
# wound differently, so it counts as NOT at the pose, and the planner is used.
# cam_lower_pos is stored in the version that pairs with cans_view: hand-taught as [-81.9, -27.5, -31.5,
# 42.9, 64.8, -107.8], it is kept as [-81.9, -27.5, -31.5, -317.1, 64.8, 252.2] - the same pose, joints 4
# and 6 a whole turn round - so a trip turns every joint at most ~167 degrees.
joint_moves:
  # `survey: cans_view` removed 2026-09-19: `survey` is now the top view, and cans_view's joint angles are the OLD
  # tilted view - a joint move "to survey" would have gone there. With one pose listed no joint move happens;
  # to get it back, jog scan -> survey once, save the survey joints in joint_positions.json and list them here.
  poses: {scan: cam_lower_pos}
  tolerance_deg: 3
