# Resource names on the Viam machine. Run scripts/00_discover.py to confirm.
arm: arm
gripper: gripper
camera: cam         # as used by move_arm.py; null = auto-pick the only camera found
motion: builtin

# How objects are found.
#   yolo   A YOLO model finds each item in the color picture; the depth pixels inside its box
#          give the 3D position, height and grasp. Finds every can (9/9 on the real table, where
#          depth alone found 6) and ignores clutter like a laptop or power strip.
#   depth  OpenCV on the depth image: ANYTHING standing above the table is an object, and
#          its color is read afterwards (HSV). Class-agnostic, so whatever colors turn up
#          get piles - including black/white/grey - with no per-color setup. Best for color.
#   viam   Viam vision services (get_object_point_clouds), as move_arm.py does. A color
#          detector only sees the colors it was configured for, so unlisted colors are
#          never picked. Best later, with a trained detector that names what it finds.
perception: yolo

yolo:
  # yoloe = open-vocabulary: it looks for the WORDS in `classes`, no training needed. Standard
  # pretrained YOLO has no "can" class and found 5/9 cans at 0.2-0.35 confidence; this finds 9/9
  # at 0.55-0.82. To use your own trained model instead: kind: yolo, weights: models/yours.pt.
  kind: yoloe
  weights: models/yoloe-11s-seg.pt   # downloaded on first use (28 MB + a 600 MB text encoder, once)
  classes: [can, bottle]
  confidence: 0.3
  imgsz: 1280

vision:
  # class label -> the vision service that finds objects of that class. A color detector +
  # segmenter only reports its ONE target color, so add one service per color you want
  # sorted (Viam app: a color_detector vision service + a detections-to-segments service
  # pointing at it), then list it here. The label is what the pile gets called.
  # `object-segmenter` is the one move_arm.py uses - rename `target` to the color it detects.
  segmenters:
    target: object-segmenter
    # blue: blue-segmenter
    # green: green-segmenter
  # true = take the class from each detection's own label instead (for an ML detector
  # that names what it found); the keys above are then just names for the services.
  use_detection_label: false

# The frame motion.move() drives. Its origin is NOT the fingertips: see
# gripper.tcp_offset in workspace.yaml.
move_frame: gripper
# The frame every pose, bound and table number in config/ is expressed in, and that the camera's
# points are converted to. `arm_origin` = the arm's own base. Not `world`: on 2026-09-18 the machine's
# world frame was recalibrated (arm now sits at (-65, 35, 26) turned -90.8 deg in it), and everything
# here was measured from the arm's base - which is also what reach is measured from.
reference_frame: arm_origin

# Every depth reading is multiplied by this. Measured 2026-09-18 on four frames from two camera poses: the
# camera saw the table 38-49 mm BELOW where the arm knows it is (z = 0) and can tops 127-129 mm high (a can
# is 122). Readings ~6 % too long explain both, and with the tilted camera they pushed every can ~20 mm away
# from the camera - the gripper came down to the right of the can. 1.0 = trust the camera.
depth_scale: 0.94

# false = trust grab()'s return value (what move_arm.py does on this UFactory gripper);
# true = ask gripper.is_holding_something() instead.
trust_is_holding: false

# Normal joint speed in deg/s, sent as arm.do_command({"set_speed": ...}). move_arm.py runs at
# the driver default of 60; 25 is deliberately cautious while this code is unproven on the arm.
arm_speed: 25
rpc_timeout_s: 30
# A color + raw depth frame is megabytes; over a relayed connection it can take a while.
image_timeout_s: 90
