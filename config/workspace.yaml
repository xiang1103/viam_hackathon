# All values world frame (origin = arm base), millimeters.

# Height of the table SURFACE. Measure it: scripts/03_record_frames.py --table
# prints the median world z of a bare table. Do not trust the fragment's -123
# until measured (it may be the obstacle box center, not its top).
table_top: -123.0

# Hard limits for any commanded gripper target. Targets outside are rejected
# before they reach the planner. Walls are at x=740 and y=500.
bounds:
  x: [150, 700]
  # -y is the table edge the arm sits at: -200 keeps the gripper over the table while still
  # allowing move_arm.py's proven pick at y=-150. Measure the real edge and tighten if needed.
  y: [-200, 460]
  z_min_above_table: 5
  z_max: 600

# Viewpoint for the top-down map in data/debug/layout*.png, so it matches how you see
# the table: "front" = you face the arm (arm at top), "behind" = you stand behind it.
map_view: front

# ZONES. The table is split into one unsorted zone and the areas where piles may be made.
#
#   unsorted_zone  where you dump the mixed items. Only objects inside it are ever
#                  picked, which is also what stops sorted items being picked again.
#   sorted_areas   free table space the robot may build piles in. It decides how many
#                  piles, where, and how big, after looking at the unsorted zone.
#                  Piles are packed along each area's long side.
#
# The arm sits at the far edge of the table on its -y side, so all the open table is
# toward +y (the side move_arm.py PLACES on, out to the side wall at y=500). Both sorted
# areas are strips on that side: `near` beside the unsorted zone, `far` beyond it and
# shorter in x so its outer corner stays within reach. They stop at y=440 to keep the
# gripper clear of the wall.
#
# THESE ARE UNTESTED GUESSES. Check the arm reaches their far corners top-down, then
# re-teach:  python scripts/01_teach_pose.py --area near   (run at two opposite corners)
# Startup fails if an area overlaps the unsorted zone, another area, or the bounds.
unsorted_zone:
  x: [230, 520]
  y: [-150, 150]

sorted_areas:
  near:
    x: [200, 560]
    y: [190, 310]
  far:
    x: [200, 480]
    y: [330, 440]

piles:
  slot_gap: 15       # clearance added to a class's largest item -> that pile's slot spacing
  min_pitch: 50      # never space slots tighter than this
  spare_slots: 1     # extra slots per pile, for items hidden under others (piles can also grow later)
  pile_gap: 30       # empty strip between neighbouring piles

segmentation:
  min_height: 8        # mm above table to count as an object
  min_area_px: 300
  top_band: 10         # mm below the object's top used for centroid / footprint

gripper:
  # Distance from the gripper FRAME ORIGIN (what motion.move positions) down to the
  # fingertips. All z values in this repo mean fingertip height; this converts.
  # 170 is inferred, not measured: move_arm.py's proven pick pose is z=75 with the
  # table near -123, which only works if the origin sits ~170 mm above the tips.
  # Erring high is the safe side (too high = grabs air, too low = hits the table).
  # Measure it with scripts/02_hover_test.py.
  tcp_offset: 170
  max_open: 80         # mm - measure on day 1; objects wider than this are skipped
  finger_depth: 25     # how far below the object's top the fingertips go
  yaw_offset_deg: 0    # calibrate with scripts/02_hover_test.py

pick:
  approach: 100        # standoff above the grasp / release height before descending
  lift: 150            # carry height above the grasp / release height
  release_clearance: 5 # release this far above the height the item was grasped at, so it is set down, not dropped
  line_tolerance_mm: 2 # descents try a straight line first, then fall back to a free plan
