# All values world frame (origin = arm base), millimeters.

# Height of the table SURFACE. 0 comes from move_arm.py's hardware-tested vision code:
# block centers are detected at z = 15-40 and anything below -20 counts as under the
# table. (The -123 in the machine config is the table OBSTACLE's center, not its top.)
# Confirm with: scripts/03_record_frames.py --table  (bare table, prints the median z)
table_top: 0.0

# Hard limits for any commanded gripper target. Targets outside are rejected
# before they reach the planner. Walls are at x=740 and y=500.
bounds:
  x: [150, 700]
  # MEASURED 2026-09-18 from an aligned depth frame: the table surface runs from y = -530
  # to y = +220 (near the arm) .. +265 (further out). So the arm sits near the table's +y
  # edge and the open table is toward -y. +180 keeps the gripper over the table while
  # still allowing move_arm.py's proven place at y = +150.
  y: [-460, 180]
  z_min_above_table: 5
  z_max: 600
  # Limits on the gripper FRAME origin (what motion.move positions), not the fingertips.
  # Floor learned on hardware in move_arm.py: a top-down gripper frame below ~60 mm
  # drives the wrist links into the table.
  frame_z_min: 60
  named_x_min: 20        # taught poses (survey) hang high above the table and may sit closer to the base than a pick can;
                         # 20 (was 50) admits the lower survey (cam_lower_pos, x = 37), which the arm has stood at
  frame_z_max: 750
  named_y_min: -500      # taught poses may reach past the pick limit toward -y (table ends ~ -530): the
                         # hand-taught scan pose (cam_lower_pos, 2026-09-19) sits at y = -487

# Viewpoint for the top-down map in data/debug/layout*.png, so it matches how you see
# the table: "front" = you face the arm (arm at top), "behind" = you stand behind it
# (arm at bottom, +y on your left).
map_view: behind

# The workcell's real walls, given to the motion planner with every move (boxes: center and size in mm,
# in machine.yaml's reference_frame). The machine config has the same walls, but in the `world` frame,
# which was recalibrated on 2026-09-18 and turned them ~90 degrees away from where they really stand.
obstacles:
  - {name: real-wall-front, center: [750, 0, 300], size: [20, 2000, 1500]}   # behind the cans, face at x = 740
  - {name: real-wall-side, center: [0, 510, 300], size: [2000, 20, 1500]}    # face at y = 500

# ZONES. One unsorted zone (the starting pile) and the areas where sorted piles may be made.
# Both can be `auto`, so the starting pile can be any size, anywhere in the search region:
#
#   unsorted_zone: auto   on the first look the robot finds everything in `search_region` and
#                         draws the zone around it (+ zone_margin). It is then fixed for the
#                         run: only items inside it are picked, so sorted items never are.
#                         Or pin it:  unsorted_zone: {x: [180, 480], y: [-150, 150]}
#   sorted_areas: auto    the free table around that zone: strips between it and the limit on
#                         the open side, plus `front` (beyond the zone, further from the arm).
#                         Each is cut short so its far corner stays within max_reach.
#                         Or pin them like:  sorted_areas: {near: {x: [200, 560], y: [-310, -190]}}
#                         Areas taught with scripts/01_teach_pose.py --area override both.
#
# The arm sits near the table's +y edge (measured: the table ends ~220-265 mm from the arm on
# that side), so the open table is toward -y - "to the right" when you stand behind the arm.
# Startup fails if an area overlaps the unsorted zone, another area, or the bounds.
unsorted_zone: auto
sorted_areas: auto

# Where the starting pile may be. Leaves at least one strip of table free on the open side.
search_region:
  x: [170, 650]
  y: [-600, 180]
zone_margin: 50

sorted_layout:
  open_side: "-y"
  gap: 40            # clear table between the unsorted zone and the first strip
  strip_depth: 120   # minimum depth of a strip; the free space is split into as many as fit
  strip_gap: 20      # between strips
  x: [200, 560]
  front_x_max: 620   # how far from the arm the `front` area (beyond the zone) may extend
  max_reach: 650     # mm from the arm base to an area's far corner (top-down reach, untested)

# The eye-level `scan` look (brand mode): crops are cut from it around each item found from above.
scan:
  crop_margin: 0.3   # extra around each item's projected box: the camera's calibration is a bit off
  max_hidden: 0.35   # an item covered more than this by nearer ones is read on a later look instead

piles:
  slot_gap: 15       # clearance added to a class's largest item -> that pile's slot spacing
  min_pitch: 50      # never space slots tighter than this
  spare_slots: 1     # extra slots per pile, for items hidden under others (piles can also grow later)
  pile_gap: 30       # empty strip between neighbouring piles

segmentation:
  min_height: 8        # mm above table to count as an object
  min_area_px: 300
  top_band: 10         # mm below the object's top used for centroid / footprint
  color_delta: 22      # how different (LAB) from the table's own color a blob must look to count...
  tall_height: 40      # ...unless it stands this tall: clear of depth noise even if table-colored
  max_object_dim: 260  # larger segments are depth noise or table edges, not an item (a water bottle is ~210)

gripper:
  # Distance from the gripper FRAME ORIGIN (what motion.move positions) down to the
  # fingertips. All z values in this repo mean fingertip height; this converts.
  # 70 is derived from move_arm.py, proven on the arm: a 30 mm block is grasped with
  # the frame at z=75, which puts the fingertips ~5 mm above the table.
  # Fine-tune with scripts/02_hover_test.py.
  tcp_offset: 70
  max_open: 80         # mm - measure on day 1; objects wider than this are skipped
  # How far below the item's top the fingertips go (true mm now that depth_scale makes heights right).
  # Tried on the arm 2026-09-18: ~25 held a can by its tapered shoulder and the grip was poor; ~37 looked
  # a little too low (palm close to the lid). 30 is just below the shoulder, on the straight wall.
  # 2026-09-18 evening, survey back at cans_view: with 30 the fingers came down a few mm too low and the can
  # slipped as it lifted -> 25. (tcp_offset stays 70: it is hardware-proven, and the blind static cycle
  # depends on it.) If the grip now lands on the tapered shoulder, go back toward 28-30.
  # 2026-09-19: cans are now full (heavier) and 25 grabbed too high -> 33, on the straight wall. Keep it
  # under ~37, where the gripper's palm reaches the lid.
  finger_depth: 33
  yaw_offset_deg: 0    # calibrate with scripts/02_hover_test.py
  # Added to every grasp point (mm, arm frame: +x = away from the arm, +y = toward the power strip side).
  # If the hover test leaves the gripper N mm short of the can, that is +N in x; N mm toward -y of it, +N in y.
  # Measured 2026-09-18 from a close-up taken while hovering over a can (lid circle vs gripper axis, no depth
  # involved): with depth_scale 0.94 the gripper sat 9 mm short and 11 mm to the left (+y) of the can.
  # 2026-09-18 evening, survey back at cans_view: grasps landed toward the power strip (+y) of the can with
  # y = -7 (~10 mm), and still well toward it with -17, so y -> -27. Direction check: gripper on the
  # power-strip side of the can = lower y; on the far side = raise y.
  xy_offset: [9, -27]

pick:
  approach: 150        # standoff above the grasp / release height before descending (as move_arm.py)
  lift: 200            # carry height above the grasp / release height: a held can must clear standing ones (122 mm)
  release_clearance: 5 # release this far above the height the item was grasped at, so it is set down, not dropped
  # The xArm driver ignores the motion service's speed, so the final run-in onto an object
  # is slowed by setting the arm's own joint speed, then restored (values from move_arm.py).
  grasp_speed: 8       # deg/s during the descent and grab
  # How often to take a new picture: once | when_needed | every_pick (see run_sort). Each one
  # is a camera download, which can take ~30 s on a slow link. --look on the CLI overrides it.
  look: when_needed
  disturb_clearance: 30  # when_needed: a neighbour closer than this (edge to edge) triggers a new picture
  line_tolerance_mm: 2 # descents try a straight line first, then fall back to a free plan
