# What to sort by. Piles are not listed here: the robot creates one per class it finds
# in the unsorted zone (see sorted_areas in workspace.yaml).
#
#   min_confidence  below this an item goes to the reject pile instead of being guessed at.
#   groups          merge classes into one pile, e.g. {warm: [red, orange, yellow]}.
modes:
  color:
    min_confidence: 0.6
    groups: {}

  # Cans and bottles, read off their labels by the team's LOCAL reader (llm/classify_image.py): free, no
  # API key. Needs Ollama running with the vision model pulled - on this laptop, or on a teammate's with
  # OLLAMA_URL=http://<their-ip>:11434 in .env. The piles are the categories in llm/categories.py;
  # the photos in reference_pics/ are sent along as examples.
  # view: scan = positions from the `survey` picture (the pose the grasp calibration was measured at), labels
  # from a second, closer picture at the `scan` pose (poses.yaml). One extra move + picture per look.
  label: &label
    classifier: local_vlm
    view: scan
    min_confidence: 0.6      # the reader's high = 0.9, medium = 0.7, low = 0.4 -> low goes to reject
    crop_pad: 0.08           # each box grown by this per side, and ...
    min_crop_side: 640       # ... enlarged to at least this, before it is sent (as scan_drinks.py does)
    groups: {}
  # The same, reading labels from the survey picture itself: one picture per look (--cam-pos).
  label_cam_pos:
    <<: *label
    view: survey

  # Cans and bottles, read off their labels by Claude. Needs ANTHROPIC_API_KEY in .env.
  brand:
    classifier: claude_brand
    # survey = the labels are visible in the survey picture itself (tilted camera): one picture per look.
    # scan   = take a second, eye-level picture from a taught `scan` pose (scripts/01_teach_pose.py scan).
    view: survey
    min_confidence: 0.6      # below this the item goes to reject instead of a guessed pile
    model: claude-opus-5
    effort: low              # a label lookup, not a reasoning task

    # The piles, and what belongs in each. A pile can span brands or split one. Anything readable
    # that fits none of them goes to an "other" pile; anything unreadable goes to reject.
    # Remove this block to get one pile per brand instead (known_brands then pins the names).
    categories:
      coke: Coca-Cola Classic / Original Taste - the red can.
      diet-coke: Diet Coke - the silver can with red lettering.
      sparkling: Spindrift, or any other sparkling / flavored water, in every flavor.
      energy-drink: Any energy drink, whatever the brand (Red Bull, Monster, Celsius and so on).
    known_brands: []
    groups: {}

# HSV color classifier. Hues in degrees (0-360).
colors:
  hues:
    red: 0
    orange: 25
    yellow: 55
    green: 120
    blue: 220
    purple: 285
  # Below these the pixel is treated as achromatic (black / grey / white by brightness).
  min_saturation: 60   # 0-255
  min_value: 50        # 0-255
