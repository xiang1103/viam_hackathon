# How classes become piles. Pile locations live in poses.yaml -> piles.
#
#   auto: true   every new label claims the next free pile, in poses.yaml order.
#                Sort by color with red/blue/green blocks -> three piles form by themselves.
#   map:         pin labels to piles. Labels can share one ("red" and "orange" -> pile_1).
#                Pinned piles are not handed out by auto.
#   min_confidence: below this the item goes to the reject pile instead of a guess.
#
# Anything left over (low confidence, or more classes than piles) goes to reject_pile.
reject_pile: reject

modes:
  color:
    auto: true
    min_confidence: 0.6
    map: {}
    # Example of pinning instead:
    # map: {red: pile_1, orange: pile_1, blue: pile_2}

# HSV color classifier. Hues in degrees (0-360).
colors:
  hues:
    red: 0
    orange: 25
    yellow: 55
    green: 120
    blue: 220
    purple: 285
  # Below these the pixel is treated as achromatic (black / grey / white by brightness).
  min_saturation: 60   # 0-255
  min_value: 50        # 0-255
